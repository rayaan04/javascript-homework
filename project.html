<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker Project</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 400px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        input { padding: 10px; border: 1px solid #ddd; border-radius: 4px; outline: none; }
        #add-btn { padding: 10px; background-color: #2ecc71; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        #add-btn:hover { background-color: #27ae60; }
        .msg-area { height: 20px; text-align: center; font-size: 14px; margin-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
        .total-wrapper { margin-top: 20px; padding: 15px; background: #f9f9f9; text-align: center; font-weight: bold; font-size: 1.1em; border-top: 2px solid #333; }
        .delete-btn { color: #e74c3c; cursor: pointer; border: none; background: none; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Expense Tracker</h2>
    
    <div class="input-group">
        <input type="text" id="itemName" placeholder="Item Name">
        <input type="number" id="itemPrice" placeholder="Price">
        <button id="add-btn">Add Expense</button>
    </div>

    <div id="statusMsg" class="msg-area"></div>

    <table>
        <thead>
            <tr>
                <th>Item</th>
                <th>Price</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="listBody"></tbody>
    </table>

    <div class="total-wrapper">
        Total: $<span id="totalValue">0</span>
    </div>
</div>

<script src="amp.js"></script>
</body>
</html>
